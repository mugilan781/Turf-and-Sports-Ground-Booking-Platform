<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to SportifyTurf — Access your dashboard, manage bookings, and book your favorite sports ground.">
  <title>Sign In — SportifyTurf</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/icons.js"></script>
</head>
<body class="page-transition">

  <main class="login-page">
    <div class="login-card">

      <!-- Brand -->
      <a href="index.html" class="login-brand" aria-label="SportifyTurf — go to home page">
        <img src="images/logo.png" alt="SportifyTurf logo" class="login-brand__img">
        <span class="login-brand__name">Sportify<span>Turf</span></span>
      </a>

      <!-- Heading -->
      <div class="login-heading">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your SportifyTurf account</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="Enter your email address" autocomplete="email" aria-required="true">
          <span class="form-error" id="login-email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" aria-required="true">
            <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Toggle password visibility"></button>
          </div>
          <span class="form-error" id="login-password-error" role="alert"></span>
        </div>

        <div class="auth-form__options">
          <label class="auth-form__checkbox">
            <input type="checkbox" id="remember-me"> Remember me
          </label>
          <a href="#" class="auth-form__forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary login-submit">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or continue with</span></div>

      <!-- Social Auth -->
      <div class="social-auth">
        <button class="social-auth-btn" aria-label="Continue with Google" onclick="window.location.href='https://www.google.com'">
          <svg class="social-auth-btn__icon" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2C41.4 36.9 44 31 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          <span>Google</span>
        </button>
        <button class="social-auth-btn" aria-label="Continue with Facebook" onclick="window.location.href='https://www.facebook.com'">
          <span class="social-auth-btn__icon" style="color:#1877F2"><span data-icon="facebook" data-icon-class="v-icon icon-md"></span></span>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Sign Up Link -->
      <p class="login-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>

    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
